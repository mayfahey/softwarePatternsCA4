<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Users</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    button { padding: 6px 10px; }
  </style>
</head>
<body>
  <h2>👥 Registered Users</h2>

  <button onclick="location.href='adminBooks.html'">📚 Back to Book Management</button>
  <button onclick="logout()">🚪 Logout</button>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="userTable"></tbody>
  </table>

  <script>
    if (localStorage.getItem("userRole") !== "ADMIN") {
      alert("Access denied. You are not an admin.");
      window.location.href = "login.html";
    }

    async function loadUsers() {
      const res = await fetch("/api/users");
      const users = await res.json();
      const table = document.getElementById("userTable");

      table.innerHTML = "";
      users.forEach(user => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${user.id}</td>
          <td>${user.username}</td>
          <td>${user.email}</td>
          <td>${user.role}</td>
          <td>
            <button onclick="viewOrders(${user.id})">🧾 View Orders</button>
          </td>
        `;
        table.appendChild(row);
      });
    }

    function viewOrders(userId) {
      localStorage.setItem("selectedUserId", userId);
      window.location.href = "adminOrders.html";
    }
    
	function logout() {
    localStorage.clear();
    window.location.href = "login.html";
  	}

    loadUsers();
  </script>
</body>
</html>
