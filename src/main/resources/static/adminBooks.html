<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Book Management</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    button, select, input { margin: 5px; padding: 6px 12px; }

    #modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
    .modal-content {
      background: white; padding: 20px; margin: 10% auto; width: 500px; border-radius: 8px;
    }
    input, textarea { width: 100%; padding: 8px; margin: 6px 0; }
  </style>
</head>
<body>
  <h2>📚 Admin Book Management</h2>

  <button onclick="openModal()">➕ Add Book</button>
  <button onclick="location.href='adminUsers.html'">👥 View Users</button>
  <button onclick="logout()">🚪 Logout</button>

  <div>
    <input type="text" id="searchInput" placeholder="Search books..." />
    <select id="searchType">
      <option value="title">Title</option>
      <option value="author">Author</option>
      <option value="category">Category</option>
      <option value="publisher">Publisher</option>
    </select>
    <button onclick="searchBooks()">🔍 Search</button>

    <select id="sortType" onchange="sortBooks()">
      <option value="">Sort by...</option>
      <option value="titleasc">Title (A-Z)</option>
      <option value="titledesc">Title (Z-A)</option>
      <option value="authorasc">Author (A-Z)</option>
      <option value="authordesc">Author (Z-A)</option>
      <option value="priceasc">Price (Low to High)</option>
      <option value="pricedesc">Price (High to Low)</option>
    </select>
    <button onclick="clearFilters()">🧹 Clear</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Title</th><th>Author</th><th>Price</th><th>Stock</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookTable"></tbody>
  </table>

  <!-- Modal -->
  <div id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Book</h3>
      <form id="bookForm">
        <input type="hidden" id="bookId" />
        <input type="text" id="title" placeholder="Title" required />
        <input type="text" id="author" placeholder="Author" required />
        <input type="text" id="publisher" placeholder="Publisher" />
        <input type="text" id="category" placeholder="Category" />
        <input type="number" id="price" placeholder="Price (€)" step="0.01" required />
        <input type="text" id="isbn" placeholder="ISBN" />
        <input type="text" id="imageUrl" placeholder="Image URL" />
        <textarea id="description" placeholder="Description"></textarea>
        <input type="number" id="stockQuantity" placeholder="Stock Quantity" required />
        <button type="submit">💾 Save</button>
        <button type="button" onclick="closeModal()">❌ Cancel</button>
      </form>
    </div>
  </div>

  <script>
    if (localStorage.getItem("userRole") !== "ADMIN") {
      alert("Access denied.");
      window.location.href = "login.html";
    }

    const bookTable = document.getElementById("bookTable");
    const modal = document.getElementById("modal");
    const form = document.getElementById("bookForm");
    const modalTitle = document.getElementById("modalTitle");

    function openModal(book = null) {
      modal.style.display = "block";
      form.reset();
      document.getElementById("bookId").value = "";
      modalTitle.textContent = book ? "Edit Book" : "Add Book";

      if (book) {
        document.getElementById("bookId").value = book.id;
        document.getElementById("title").value = book.title;
        document.getElementById("author").value = book.author;
        document.getElementById("publisher").value = book.publisher;
        document.getElementById("category").value = book.category;
        document.getElementById("price").value = book.price;
        document.getElementById("isbn").value = book.isbn;
        document.getElementById("imageUrl").value = book.imageUrl;
        document.getElementById("description").value = book.description;
        document.getElementById("stockQuantity").value = book.stockQuantity;
      }
    }

    function closeModal() {
      modal.style.display = "none";
    }

    async function fetchBooks(url = "/api/books") {
      const res = await fetch(url);
      const books = await res.json();
      displayBooks(books);
    }

    function displayBooks(books) {
      bookTable.innerHTML = "";
      books.forEach(book => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${book.title}</td>
          <td>${book.author}</td>
          <td>€${book.price.toFixed(2)}</td>
          <td>${book.stockQuantity}</td>
          <td>
            <button onclick='openModal(${JSON.stringify(book)})'>✏️ Edit</button>
            <button onclick='deleteBook(${book.id})'>🗑️ Delete</button>
          </td>
        `;
        bookTable.appendChild(row);
      });
    }

    async function deleteBook(id) {
      if (confirm("Are you sure you want to delete this book?")) {
        await fetch(`/api/books/${id}`, { method: "DELETE" });
        fetchBooks();
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        publisher: document.getElementById("publisher").value,
        category: document.getElementById("category").value,
        price: parseFloat(document.getElementById("price").value),
        isbn: document.getElementById("isbn").value,
        imageUrl: document.getElementById("imageUrl").value,
        description: document.getElementById("description").value,
        stockQuantity: parseInt(document.getElementById("stockQuantity").value)
      };
      const id = document.getElementById("bookId").value;
      const method = id ? "PUT" : "POST";
      const url = id ? `/api/books/${id}` : "/api/books";

      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(book)
      });

      if (res.ok) {
        closeModal();
        fetchBooks();
      } else {
        alert("Error saving book.");
      }
    });

    function searchBooks() {
      const input = document.getElementById("searchInput").value.trim();
      const type = document.getElementById("searchType").value;
      if (!input) return fetchBooks();
      fetch(`/api/books/search/${type}?${type}=${input}`)
        .then(res => res.json())
        .then(data => displayBooks(data));
    }

    function sortBooks() {
      const sort = document.getElementById("sortType").value;
      if (!sort) return fetchBooks();
      fetch(`/api/books/sorted?sortType=${sort}`)
        .then(res => res.json())
        .then(data => displayBooks(data));
    }

    function clearFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("sortType").value = "";
      fetchBooks();
    }

    function logout() {
      localStorage.clear();
      window.location.href = "login.html";
    }

    fetchBooks();
  </script>
</body>
</html>
