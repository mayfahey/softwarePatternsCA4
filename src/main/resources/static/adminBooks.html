<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Book Management</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: auto; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }

    button { margin: 5px; padding: 6px 12px; }

    /* Modal styles */
    #modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background: white;
      padding: 20px;
      margin: 10% auto;
      width: 500px;
      border-radius: 8px;
    }
    input, textarea {
      width: 100%; padding: 8px; margin: 6px 0;
    }
  </style>
</head>
<body>
  <h2>📚 Admin Book Management</h2>

  <button onclick="openModal()">➕ Add Book</button>
  <button onclick="location.href='adminUsers.html'">👥 View Users</button>
  <button onclick="logout()">🚪 Logout</button>
  

  <table>
    <thead>
      <tr>
        <th>Title</th><th>Author</th><th>Price</th><th>Stock</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookTable"></tbody>
  </table>

  <!-- Modal -->
  <div id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">Add Book</h3>
      <form id="bookForm">
        <input type="hidden" id="bookId" />
        <input type="text" id="title" placeholder="Title" required />
        <input type="text" id="author" placeholder="Author" required />
        <input type="text" id="publisher" placeholder="Publisher" />
        <input type="text" id="category" placeholder="Category" />
        <input type="number" id="price" placeholder="Price (€)" step="0.01" required />
        <input type="text" id="isbn" placeholder="ISBN" />
        <input type="text" id="imageUrl" placeholder="Image URL" />
        <textarea id="description" placeholder="Description"></textarea>
        <input type="number" id="stockQuantity" placeholder="Stock Quantity" required />
        <button type="submit">💾 Save</button>
        <button type="button" onclick="closeModal()">❌ Cancel</button>
      </form>
    </div>
  </div>

  <script>
    // Role check
    if (localStorage.getItem("userRole") !== "ADMIN") {
      alert("Access denied. You are not an admin.");
      window.location.href = "login.html";
    }

    const bookTable = document.getElementById("bookTable");
    const modal = document.getElementById("modal");
    const form = document.getElementById("bookForm");
    const modalTitle = document.getElementById("modalTitle");

    function openModal(book = null) {
      modal.style.display = "block";
      form.reset();
      document.getElementById("bookId").value = "";
      modalTitle.textContent = book ? "Edit Book" : "Add Book";

      if (book) {
        document.getElementById("bookId").value = book.id;
        document.getElementById("title").value = book.title;
        document.getElementById("author").value = book.author;
        document.getElementById("publisher").value = book.publisher;
        document.getElementById("category").value = book.category;
        document.getElementById("price").value = book.price;
        document.getElementById("isbn").value = book.isbn;
        document.getElementById("imageUrl").value = book.imageUrl;
        document.getElementById("description").value = book.description;
        document.getElementById("stockQuantity").value = book.stockQuantity;
      }
    }

    function closeModal() {
      modal.style.display = "none";
    }

    async function loadBooks() {
      const res = await fetch("/api/books");
      const books = await res.json();
      bookTable.innerHTML = "";

      books.forEach(book => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${book.title}</td>
          <td>${book.author}</td>
          <td>€${book.price.toFixed(2)}</td>
          <td>${book.stockQuantity}</td>
          <td>
            <button onclick='openModal(${JSON.stringify(book)})'>✏️ Edit</button>
            <button onclick='deleteBook(${book.id})'>🗑️ Delete</button>
          </td>
        `;
        bookTable.appendChild(row);
      });
    }

    async function deleteBook(id) {
      if (confirm("Are you sure you want to delete this book?")) {
        await fetch(`/api/books/${id}`, { method: "DELETE" });
        loadBooks();
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const book = {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        publisher: document.getElementById("publisher").value,
        category: document.getElementById("category").value,
        price: parseFloat(document.getElementById("price").value),
        isbn: document.getElementById("isbn").value,
        imageUrl: document.getElementById("imageUrl").value,
        description: document.getElementById("description").value,
        stockQuantity: parseInt(document.getElementById("stockQuantity").value)
      };

      const id = document.getElementById("bookId").value;
      const method = id ? "PUT" : "POST";
      const url = id ? `/api/books/${id}` : "/api/books";

      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(book)
      });

      if (res.ok) {
        closeModal();
        loadBooks();
      } else {
        alert("Error saving book.");
      }
    });
    
    function logout() {
    localStorage.clear();
    window.location.href = "login.html";
  	}

    loadBooks();
  </script>
</body>
</html>
