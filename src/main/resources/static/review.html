<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Leave a Review</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    select, textarea, input, button { width: 100%; margin: 10px 0; padding: 10px; }
  </style>
</head>
<body>
  <h2>⭐ Leave a Review</h2>

  <form id="reviewForm">
    <select id="bookSelect" required>
      <option value="">Select a Book</option>
    </select>

    <label for="rating">Rating (1–5):</label>
    <input type="number" id="rating" min="1" max="5" required />

    <textarea id="comment" placeholder="Write your review..." rows="4" required></textarea>

    <button type="submit">Submit Review</button>
  </form>

  <button onclick="location.href='books.html'">⬅ Back to Books</button>

  <script>
    const customerId = localStorage.getItem("customerId");

    async function loadBooks() {
      try {
        const res = await fetch("/api/books");
        if (!res.ok) {
          alert("Failed to load books.");
          return;
        }

        const books = await res.json();
        const select = document.getElementById("bookSelect");

        books.forEach(book => {
          const option = document.createElement("option");
          option.value = book.id;
          option.textContent = book.title;
          select.appendChild(option);
        });
      } catch (err) {
        console.error("Error loading books:", err);
        alert("Error fetching books.");
      }
    }

    document.getElementById("reviewForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const bookId = document.getElementById("bookSelect").value;
      const rating = document.getElementById("rating").value;
      const comment = document.getElementById("comment").value;

      try {
        const res = await fetch(`/api/reviews?bookId=${bookId}&customerId=${customerId}&rating=${rating}&comment=${encodeURIComponent(comment)}`, {
          method: "POST"
        });

        if (res.ok) {
          alert("✅ Review submitted!");
          location.href = "books.html";
        } else {
          alert("Something went wrong. Please try again.");
        }
      } catch (err) {
        console.error("Review submission error:", err);
        alert("Error submitting review.");
      }
    });

    loadBooks();
  </script>
</body>
</html>
