<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; }
    input, button { display: block; width: 100%; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>🔐 Login</h2>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <p><a href="index.html">⬅ Back to Home</a></p>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const userRes = await fetch(`/api/users/login?username=${username}&password=${password}`);
        
        if (!userRes.ok) throw new Error("Login failed");

        const user = await userRes.json();
        const userId = user.id;

        // Get associated customer profile
        const profileRes = await fetch(`/api/customer-profiles/by-user/${userId}`);
        const profile = await profileRes.json();

        localStorage.setItem("customerId", profile.id);
        alert("Login successful!");
        window.location.href = "books.html";
      } catch (err) {
        console.error(err);
        alert("Invalid username or password.");
      }
    });
  </script>
</body>
</html>
