<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; }
    input, button { display: block; width: 100%; padding: 10px; margin: 10px 0; }
    a { text-align: center; display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>🔐 Login</h2>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <a href="register.html">🆕 Don’t have an account? Register here</a>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const userRes = await fetch(`/api/users/login?username=${username}&password=${password}`);
        if (!userRes.ok) throw new Error("Login failed");

        const user = await userRes.json();
        localStorage.setItem("userId", user.id);
        localStorage.setItem("userRole", user.role);

        if (user.role === "CUSTOMER") {
          const profileRes = await fetch(`/api/customer-profiles/by-user/${user.id}`);
          const profile = await profileRes.json();
          localStorage.setItem("customerId", profile.id);
          alert("Login successful!");
          window.location.href = "books.html";
        } else if (user.role === "ADMIN") {
          alert("Welcome, Admin!");
          window.location.href = "adminBooks.html";
        } else {
          alert("Unknown role. Access denied.");
        }
      } catch (err) {
        console.error(err);
        alert("Invalid username or password.");
      }
    });
  </script>
</body>
</html>
