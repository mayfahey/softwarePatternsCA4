<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; }
    input, select, button { display: block; width: 100%; padding: 10px; margin: 10px 0; }
  </style>
</head>
<body>
  <h2>🆕 Register</h2>

  <form id="registerForm">
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    <input type="email" id="email" placeholder="Email" required />

    <label for="role">Register as:</label>
    <select id="role" required>
      <option value="CUSTOMER">Customer</option>
      <option value="ADMIN">Admin</option>
    </select>

    <button type="submit">Register</button>
  </form>

  <p><a href="login.html">🔐 Back to Login</a></p>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const user = {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
        email: document.getElementById("email").value,
        role: document.getElementById("role").value
      };

      try {
        const userRes = await fetch("/api/users/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(user),
        });

        const userData = await userRes.json();
        const userId = userData.id;
        const userRole = userData.role;

        localStorage.setItem("userId", userId);
        localStorage.setItem("userRole", userRole);

        if (userRole === "CUSTOMER") {
          // Create empty profile
          const profile = {
            shippingAddress: "",
            paymentMethod: "",
            loyaltyPoints: 0
          };

          const profileRes = await fetch(`/api/customer-profiles/create?userId=${userId}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(profile),
          });

          const profileData = await profileRes.json();
          localStorage.setItem("customerId", profileData.id);

          alert("Customer registered successfully!");
          window.location.href = "books.html";
        } else if (userRole === "ADMIN") {
          alert("Admin registered successfully!");
          window.location.href = "adminBooks.html";
        }

      } catch (err) {
        console.error(err);
        alert("Registration failed!");
      }
    });
  </script>
</body>
</html>
