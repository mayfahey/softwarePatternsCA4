<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .item { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
    input[type="number"] { width: 60px; }
    button { margin: 5px; padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>🛒 Your Shopping Cart</h2>

  <div id="cartList"></div>
  <h3>Total: €<span id="total">0.00</span></h3>

  <button onclick="location.href='checkout.html'">✅ Proceed to Checkout</button>
  <button onclick="location.href='books.html'">⬅ Back to Books</button>
  <button onclick="location.href='index.html'">🏠 Home</button>

  <script>
    const customerId = localStorage.getItem("customerId");

    async function loadCart() {
      if (!customerId) {
        alert("Not logged in!");
        return;
      }

      const res = await fetch(`/api/cart/items?customerId=${customerId}`);
      const items = await res.json();
      const list = document.getElementById("cartList");
      const totalDisplay = document.getElementById("total");

      let total = 0;
      list.innerHTML = "";

      items.forEach(item => {
        const itemTotal = item.priceAtTime * item.quantity;
        total += itemTotal;

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <strong>${item.book.title}</strong><br>
          €${item.priceAtTime.toFixed(2)} each<br>
          Quantity: 
          <input type="number" id="qty-${item.book.id}" value="${item.quantity}" min="0" />
          <button onclick="updateQuantity(${item.book.id})">Update</button>
          <button onclick="removeItem(${item.book.id})">Remove</button>
          <br>Total for item: €${itemTotal.toFixed(2)}
        `;

        list.appendChild(div);
      });

      totalDisplay.textContent = total.toFixed(2);
    }

    function removeItem(bookId) {
      fetch(`/api/cart/remove?customerId=${customerId}&bookId=${bookId}`, {
        method: "DELETE"
      }).then(() => loadCart());
    }

    function updateQuantity(bookId) {
      const quantity = parseInt(document.getElementById(`qty-${bookId}`).value);
      fetch(`/api/cart/update-quantity?customerId=${customerId}&bookId=${bookId}&quantity=${quantity}`, {
        method: "PUT"
      }).then(() => loadCart());
    }

    loadCart();
  </script>
</body>
</html>
